[project]
name = "sombrear-voz"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[google,openai,silero,turn-detector]~=1.8",
    "livekit-plugins-cartesia==1.8.8",
    "livekit-plugins-elevenlabs==1.8.8",
    "livekit-plugins-noise-cancellation~=0.3.2",
    "num2words>=0.5.14",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
local = [
    "kokoro-onnx>=0.6.1",
    "onnx-asr[cpu,hub]>=0.12.0",
    "soundfile>=0.14.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "testes"]
testpaths = ["testes"]
asyncio_mode = "auto"
